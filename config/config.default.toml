# Steam Frame LSFG Global Configuration File (Schema Version 2)
# Compatible with upstream lsfg-vk layer and Valve SteamOS ARM64
version = 2

[global]
dll = "~/.local/share/steam-frame-lsfg/lib/Lossless.dll"
allow_fp16 = true
log_level = "info"
log_file = "~/.local/share/steam-frame-lsfg/lsfg.log"

[[profile]]
name = "Default"
active_in = [
    ".exe",
    "vkcube",
    "vkcubepp",
    "ScarletNexus.exe",
    "775500"
]
multiplier = 2
flow_scale = 0.75
performance_mode = true
pacing_mode = "vsync"

[[profile]]
name = "Cyberpunk 2077"
active_in = ["Cyberpunk2077.exe", "1091500"]
multiplier = 2
flow_scale = 0.75
performance_mode = true
pacing_mode = "vsync"

[[profile]]
name = "Hades II"
active_in = ["Hades2.exe", "1145360"]
multiplier = 2
flow_scale = 1.00
performance_mode = true
pacing_mode = "vsync"
